steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - '$_IMAGE_URL'
      - .

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '$_IMAGE_URL'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '$_SERVICE_NAME'
      - --image=$_IMAGE_URL
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      # A WebSocket counts as one long request; the default 300s would sever a
      # session that idles mid-conversation.
      - --timeout=900
      # Keeps a browser's HTTP and WS traffic on one instance.
      - --session-affinity
      - --set-secrets=GEMINI_API_KEY=gemini-api-key:latest
      - --set-env-vars=GEMINI_MODEL=gemini-3.6-flash,GEMINI_REACTION_MODEL=gemini-3.5-flash-lite,GEMINI_LIVE_MODEL=gemini-3.1-flash-live-preview,GEMINI_TTS_MODEL=gemini-3.1-flash-live-preview,GEMINI_TTS_VOICE=Charon

substitutions:
  _SERVICE_NAME: ford-gotham-discover
  _REGION: us-central1
  # Written out in full because neither built-in substitutions ($PROJECT_ID) nor
  # other user substitutions expand inside a substitution's default value.
  # Tagged :latest rather than :$SHORT_SHA, which is only populated by build
  # triggers — a manual `gcloud builds submit` would push a dangling tag.
  # Override the whole URL to deploy elsewhere or pin a version:
  #   gcloud builds submit --substitutions=_IMAGE_URL=…/app:v2
  _IMAGE_URL: us-central1-docker.pkg.dev/vml-map-xd-ford/ford-gotham-discover/app:latest

images:
  - '$_IMAGE_URL'

options:
  logging: CLOUD_LOGGING_ONLY
